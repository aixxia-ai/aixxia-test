<!doctype html>
<html lang="nl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>AIXXIA — test</title>
  <meta name="robots" content="noindex" />
  <style>
    :root { --bg:#0a0a0a; --fg:#f5f0ea; --muted:#9a938a; --accent:#ff6a1a; }
    * { box-sizing:border-box; margin:0; padding:0; }
    html,body { height:100%; }
    body {
      font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;
      background:radial-gradient(120% 120% at 50% 0%, #17120d 0%, var(--bg) 55%);
      color:var(--fg); min-height:100%;
      display:flex; align-items:center; justify-content:center; text-align:center;
      padding:2rem;
    }
    .card { max-width:640px; }
    .badge {
      display:inline-block; font-size:.75rem; letter-spacing:.18em; text-transform:uppercase;
      color:var(--accent); border:1px solid rgba(255,106,26,.35); border-radius:999px;
      padding:.4rem .9rem; margin-bottom:2rem;
    }
    h1 {
      font-size:clamp(3rem,12vw,6rem); font-weight:800; letter-spacing:.02em; line-height:1;
      background:linear-gradient(180deg,#fff 0%, #ffb37a 60%, var(--accent) 100%);
      -webkit-background-clip:text; background-clip:text; color:transparent;
    }
    p.lead { margin-top:1.25rem; font-size:1.15rem; color:var(--fg); }
    p.sub { margin-top:.5rem; color:var(--muted); font-size:.95rem; }
    .dot { display:inline-block; width:.55rem; height:.55rem; border-radius:50%; background:#37d67a; margin-right:.5rem; vertical-align:middle; box-shadow:0 0 12px #37d67a; }
    footer { margin-top:2.5rem; color:var(--muted); font-size:.8rem; }
    code { color:var(--accent); }
  </style>
</head>
<body>
  <main class="card">
    <span class="badge">Deployment test</span>
    <h1>AIXXIA</h1>
    <p class="lead"><span class="dot"></span>Deze pagina staat live.</p>
    <p class="sub">Geserveerd vanaf Vercel op <code>test.aixxia.ai</code></p>
    <footer>Testomgeving — geen productie · AIXXIA</footer>
  </main>
</body>
</html>
